MatkewaaliIdentityPool:
  Type: AWS::Cognito::IdentityPool
  Properties:
    IdentityPoolName: !Sub "matkewaali-${Environment}"
    AllowUnauthenticatedIdentities: true

MatkewaaliUnauthRole:
  Type: AWS::IAM::Role
  Properties:
    RoleName: !Sub "matkewaali-unauth-${Environment}"
    AssumeRolePolicyDocument:
      Version: '2012-10-17'
      Statement:
        - Effect: Allow
          Principal:
            Federated: cognito-identity.amazonaws.com
          Action: sts:AssumeRoleWithWebIdentity
          Condition:
            StringEquals:
              cognito-identity.amazonaws.com:aud: !Ref MatkewaaliIdentityPool
            ForAnyValue:StringLike:
              cognito-identity.amazonaws.com:amr: unauthenticated
    Policies:
      - PolicyName: ApiInvoke
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: execute-api:Invoke
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MatkewaaliServiceApi}/api/*"

MatkewaaliIdentityPoolRoles:
  Type: AWS::Cognito::IdentityPoolRoleAttachment
  Properties:
    IdentityPoolId: !Ref MatkewaaliIdentityPool
    Roles:
      unauthenticated: !GetAtt MatkewaaliUnauthRole.Arn
