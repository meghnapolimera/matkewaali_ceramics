ProductImagesBucket:
  Type: AWS::S3::Bucket
  Properties:
    BucketName: !Sub "matkewaali-product-images-${Environment}"
    PublicAccessBlockConfiguration:
      BlockPublicAcls: false
      BlockPublicPolicy: false
      IgnorePublicAcls: false
      RestrictPublicBuckets: false

ProductImagesBucketPolicy:
  Type: AWS::S3::BucketPolicy
  Properties:
    Bucket: !Ref ProductImagesBucket
    PolicyDocument:
      Version: '2012-10-17'
      Statement:
        - Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource: !Sub "arn:aws:s3:::matkewaali-product-images-${Environment}/*"
