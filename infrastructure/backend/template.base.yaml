AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - test
      - prod
  AlertEmail:
    Type: String
    Default: ""
  SquareAppId:
    Type: String
  SquareLocationId:
    Type: String

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs22.x

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${MatkewaaliServiceApi}.execute-api.${AWS::Region}.amazonaws.com/api"
    Export:
      Name: !Sub "matkewaali-api-url-${Environment}"
  IdentityPoolId:
    Description: Cognito Identity Pool ID for frontend auth
    Value: !Ref MatkewaaliIdentityPool
    Export:
      Name: !Sub "matkewaali-identity-pool-id-${Environment}"
